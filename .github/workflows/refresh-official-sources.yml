name: Refresh official regional source directory
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh official directory
        run: python scripts/update_official_sources.py
      - name: Commit updated directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official regional source directory"
            git push
          fi
